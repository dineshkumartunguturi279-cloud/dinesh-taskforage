[build]
builder = "nixpacks"

[deploy]
startCommand = "python3 manage.py migrate --noinput && python3 manage.py collectstatic --noinput && gunicorn backend.wsgi --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
healthcheckPath = "/api/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
