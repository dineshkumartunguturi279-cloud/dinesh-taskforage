[phases.setup]
nixPkgs = ["python312", "postgresql"]

[phases.build]
cmds = [
    "python -m pip install -r requirements.txt",
    "python manage.py collectstatic --noinput"
]

[start]
cmd = "python manage.py migrate --noinput && gunicorn backend.wsgi --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
